  .research/analysis/campaigns/solution-space-decomposition/specialists/decision-option-generation.md:
    summary: Within-specialist brief for the decision-option-generation facet. Decision analysis and judgment-and-decision-making
      research measure how incomplete unaided generation of objectives and alternatives is (roughly a
      third to a half of later-recognized items, with overlooked items about as important as generated
      ones), using a generate-then-recognize design against an independently compiled master list. It
      reports which prompts change that (warning-plus-numeric-challenge, objectives as stimuli, second-pass
