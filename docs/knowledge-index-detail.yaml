  .research/analysis/campaigns/solution-space-decomposition/specialists/coverage-estimation.md:
    summary: 'Within-specialist brief on two linked questions. First, how ecological species-richness
      and sample-coverage estimators (Chao1/Chao2, iChao, jackknife, ACE, Good–Turing coverage and discovery
      probability, rarefaction/extrapolation, Hill numbers, accumulation curves) estimate how complete
      a sample of distinct kinds is, what they assume, how they behave with few singletons and doubletons,
      and how they have been carried into vocabulary size, software testing, inspection defect counts
      and idea generation. Second, what the evidence says about whether human or model reviewers detect
      missing items, how structured and free review compare, and when independent passes disagree because
      of classification rather than retrieval. Main findings: singleton/doubleton estimators are lower
      bounds under heterogeneity; sample coverage is estimable when richness is not; estimates are relative
      to the sampling process and to the identity threshold that defines a "kind"; small, adaptive or
      few-pass samples underestimate; omissions are detected markedly less often than commissions by both
      humans and models; and a large share of between-pass disagreement in reviews and mappings is classification,
      not retrieval.'
