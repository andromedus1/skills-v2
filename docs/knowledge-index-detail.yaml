  .research/analysis/campaigns/solution-space-decomposition/specialists/design-space-methods.md:
    summary: How general morphological analysis, morphological matrices, TRIZ, QOC/Design Space Analysis,
      set-based concurrent engineering, software design spaces and objective-driven alternative generation
      construct an option space, keep alternatives from collapsing into variations of one idea, and prune;
      what completeness signals they offer (full-field coverage, consistency-reduced solution space, abstraction-weighted
      variety, master-list recall, capture-recapture style estimates); and how thin the measured evidence
      is relative to the advocated benefits.
  .research/analysis/campaigns/solution-space-decomposition/specialists/design-space-methods.refs.md:
    summary: Pre-merge bibliography block for the design-space-methods specialist; entries are merged
      into .research/references.md in block order.
  .research/analysis/campaigns/solution-space-decomposition/specialists/landscape-mapping.md:
    summary: Within-specialist brief. Compares how patent landscape reports (WIPO guidelines, RIPL reporting
      standard, automated seed-expansion landscaping), systematic mapping studies in software engineering
      (Petersen keywording, known-set / quasi-gold-standard search validation, hybrid snowballing), general
      morphological analysis and scenario methods, technology roadmapping, technology intelligence / horizon
      scanning, and competitive / analogous-market search define landscape boundaries, organise items
      into families, guard against blind spots (vocabulary mismatch, single-source and single-domain search,
      seed dependence) and check coverage. Most of the field's moves are advocated in guidelines; measured
      evidence exists mainly for search recall against a known set, for the low overlap of independent
      maps or reviews of the same topic, and for the novelty gain of drawing on analogous domains. No
      tradition reports a validated completeness estimate for the set of families (as opposed to items
      within known families).
  .research/analysis/campaigns/solution-space-decomposition/specialists/landscape-mapping.refs.md:
    summary: Pre-merge bibliography block for the landscape-mapping specialist; entries are merged into
      .research/references.md in block order.
  .research/analysis/campaigns/solution-space-decomposition/specialists/llm-ideation-diversity.md:
    summary: Within-specialist brief. Measured evidence that LLM-generated or LLM-assisted idea pools
      are less diverse than independent human pools, chiefly at the collective/across-sample level and
      across model families; alignment-linked mode collapse; recall (not encoding) limits on long-tail
      items; and an authoring-versus-judging asymmetry in which omissions resist review. Techniques with
      measured diversity gains (multi-step "generate then make different" chain-of-thought, ordinary personas,
      verbalized sampling, in-context regeneration, explicit dimension/approach elicitation, lens-anchored
      multi-agent setups) are separated from advocated or qualitatively evaluated ones, and null/negative
      results (seeding, similarity feedback, hybrid select, temperature, standard debate, celebrity personas,
      creativity system prompts) are reported. Diversity/coverage metrics (embedding dispersion, dedup-threshold
      unique counts, capture-recapture estimates, exhaustion curves, category-combination counts, learned
      equivalence classes, human ratings) and their validity limits are catalogued.
  .research/analysis/campaigns/solution-space-decomposition/specialists/llm-ideation-diversity.refs.md:
    summary: Pre-merge bibliography block for the llm-ideation-diversity specialist; entries are merged
      into .research/references.md in block order.
  .research/analysis/campaigns/solution-space-decomposition/specialists/search-completeness.md:
    summary: Evidence-synthesis and qualitative-research methods for deciding when a set of retrieved
      items is complete enough to stop. Covers multi-strategy search, citation chasing, known-item and
      relative-recall benchmarks, capture-recapture, statistical stopping for screening, and saturation.
      Most rules are advocated rather than validated, several measurably fail, and most completeness estimators
      depend on overlap between independent passes.
    key_findings:
    - Reporting standards (PRISMA-S) cover how complete the search report is, not how complete the retrieved
      set is; the main guidance says objective stopping is hard and little evaluated.
    - Supplementary strategies (snowballing, citation tracking, expert contact, specialist sources) often
      find items that database search missed, but the added yield varies widely with topic, and the evidence
      comes mostly from weak designs.
    - Relative recall and known-item checks only measure against what the combined passes already found.
      They can look high even when true recall is low.
    - Capture-recapture gives a number-missed estimate from overlap between passes. It assumes independent
      passes, and estimates swing with model choice; under heterogeneity Chao's estimator is a lower bound.
    - In screening, stopping after N consecutive irrelevant items or at a baseline rate missed the 95%
      recall target in about 39% of runs. Hypothesis-test criteria achieved their stated confidence at
      a cost in extra screening.
    - Saturation is a judgement about unobserved items. Measured stopping points still leave a fraction
      of eventual themes unseen, and code-level saturation arrives before meaning-level saturation.
  .research/analysis/campaigns/solution-space-decomposition/specialists/search-completeness.refs.md:
    summary: Pre-merge bibliography block for the search-completeness specialist; entries are merged into
      .research/references.md in block order.
  .research/analysis/campaigns/solution-space-decomposition/specialists/taxonomy-construction.md:
    summary: Methods for building taxonomies, typologies and faceted classifications of a domain's objects,
      what they treat as "genuinely different", and the completeness (ending) conditions they prescribe.
      Covers the Nickerson–Varshney–Muntermann iterative method, Bailey's conceptual/empirical typology
      construction (cite-through), logical division and MECE, facet analysis, the four epistemic routes
      to forming classes, explanatory typologies, morphological fields, and participant-sorting methods
      (concept mapping, card sorting). Ending conditions are designed and advocated, not validated; measured
      evidence exists for the reliability of classifying objects into a fixed scheme and for the stability
      of sort-derived groupings, but not for whether a scheme's dimensions are complete.
    key_findings:
    - The IS taxonomy method defines a taxonomy as dimensions of mutually exclusive, collectively exhaustive
      characteristics, chosen by a purpose-derived meta-characteristic, built through alternating empirical-to-conceptual
      and conceptual-to-empirical iterations until objective and subjective ending conditions hold. Its
      authors say the meta-characteristic critically shapes the result and that the same meta-characteristic
      can yield different taxonomies.
    - The objective ending conditions are mostly stability checks on the last iteration (no new or merged
      dimensions, no merged or split objects, every characteristic populated, unique cells). They test
      convergence on the objects examined, not coverage of unexamined ones; the authors give no evidence
      that meeting them signals completeness.
    - Surveys of practice find ending conditions rarely stated (17% of journal taxonomies) and, when stated,
      often asserted without detail (16 of 38) or selectively dropped, including dropping mutual exclusivity
      for readability.
    - Classification sources treat MECE as an ideal that working schemes rarely meet. Exhaustivity is
      usually secured with a residual "other" class, not by showing coverage; exclusivity is fragile when
      more than one basis of division is mixed.
    - Measured reliability concerns assigning objects to an existing scheme. Defect-classification kappas
      of 0.66–0.82 have been reported, but in another study raters disagreed 43% of the time while nearly
      all of them (97%) still gave each item exactly one category. A feeling that categories don't overlap
      is therefore not evidence that raters agree.
    - Sorting-based methods (card sorting, concept mapping) have measured cross-study stability of item
      groupings (Mantel r 0.61–0.93; 63–93% navigation-scheme agreement) and a sample-size curve (r 0.90
      with full-sample similarity at 15 sorters). Where the dendrogram is cut, and how many clusters to
      keep, is left to judgement.
    - Knowledge-organization critiques hold that the choice of dimensions, the similarity measure and
      the epistemic route (logical division, phenetic similarity, genealogy, purpose) each change the
      resulting classes, and that no neutral or single correct classification exists.
  .research/analysis/campaigns/solution-space-decomposition/specialists/taxonomy-construction.refs.md:
    summary: Pre-merge bibliography block for the taxonomy-construction specialist; entries are merged
      into .research/references.md in block order.
