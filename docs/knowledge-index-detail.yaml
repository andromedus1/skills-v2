  .research/analysis/campaigns/qvc-review-evidence/parent.md:
    summary: 'Cross-facet synthesis on two questions about review and advisory controls for generated
      work. Same-model judging carries a measured self-preference that, with ground truth, is mostly legitimate
      for stronger models but more harmful when the judge is wrong; a different-model judge grading without
      references still favours similar models. In MT-bench''s math-grading comparison (20 judgements per
      prompt), reference guidance cut judge failures most (14/20 to 3/20) and chain-of-thought also cut
      them (to 6/20); chain-of-thought lowered harmful self-preference in another study; reference-based
      feedback reduced self-bias in another study. One randomized experiment found one-person inspections
      poorer than two- or four-person ones, though its abstract reports no significant treatment effect;
      no fetched source measures whether an earlier approval safely covers later changes. Noisy warnings
      are ignored when delivered outside the work context. Facebook reports diff-time findings, given
      to developers as part of code review, acted on at high rates (the source does not say whether they
      gate landing); Google reports low not-useful click ratios, which undercount ignoring, for review-time
      findings that reviewers typically enforce. False-positive thresholds are definition-specific.

      '
    key_findings:
    - Self-preference in LLM judges is reported by several groups; with ground truth, stronger models'
      self-preference is mostly legitimate, but more harmful when they are wrong.
    - A different-model judge grading without references still favours functionally similar models, so
      model identity is not independence; in MT-bench's comparison of default, chain-of-thought and reference-guided
      judge prompts (20 math judgements per prompt), reference guidance produced the largest reduction
      in judge failures and chain-of-thought also reduced them, and chain-of-thought lowered harmful self-preference
      in another study; panel diversity helped in one study.
    - No fetched study isolates same-model versus different-model review of generated code as the single
      varied factor.
    - In one randomized experiment one inspector did worse than two or four, which did not differ, though
      its abstract reports no significant treatment effect; effort rose with reviewer count. Links between
      review participation and later defects were unstable and added no model fit in an independent replication.
    - Re-review after changes is governed by documented or designed policy (approve-with-comments; diff-tied
      approval dismissal); no fetched source measures post-approval defect introduction.
    - At an unchanged estimated false-positive rate, moving one analysis from a nightly batch list to
      diff time moved its fix rate from near zero to over 70% (uncontrolled); a Google code-review integration
      of FindBugs was still discontinued over effective false positives and inconsistent per-user customization.
    - Published thresholds (zero effective false positives to block; under 10% for review-time checks;
      probation at a 10% not-useful rate) are defined by developer action, not report correctness, and
      were not validated against outcomes.
    - 'Override or non-action is not by itself degradation: on average about half of outpatient alert
      overrides were judged appropriate (12% to 92% by alert type).'
  .research/analysis/campaigns/qvc-review-evidence/specialists/reviewer-independence.md:
    summary: LLM judges measurably favour their own and similar models' outputs, but much of that preference
      tracks real quality, and reference-based feedback reduced it; diverse panels and human-plus-model
      teams show bounded gains in single-group studies. One randomized inspection experiment finds one
      reviewer weaker than two and little gain from two to four, though its abstract reports no significant
      treatment effect; links between review measures and later defects are weak or unstable. No fetched
      source measures defects introduced by changes made after an approval; re-review rules found are
      documented or designed policies.
    key_findings:
    - Judge favouritism toward a judge's own (and functionally similar) outputs is reported by several
      independent groups across tasks; a ground-truth study finds stronger models' self-preference mostly
      legitimate yet more harmful when they are wrong.
    - Switching to a different model does not remove correlated-judgement risk; a similarity study finds
      judges grading without references favour functionally similar models, and model errors growing more
      alike with capability.
    - Reference grounding (a reference answer or reference-based oracle feedback) is associated with reduced
      judge error; in MT-bench's comparison of default, chain-of-thought and reference-guided judge prompts
      (10 math questions, 20 judgements per prompt), a reference-guided judge cut failures most (14/20
      default to 3/20) and a chain-of-thought judge also cut them (to 6/20), and chain-of-thought and
      long-reasoning judging lowered harmful self-preference in another study. Model identity alone was
      not the varied factor in most studies. No fetched study gave judges executable tests.
    - A randomized inspection experiment found one-person teams poorer than two- or four-person teams
      and no difference between two and four, with effort rising with reviewer count; its abstract reports
      no significant treatment effects on effectiveness overall.
    - Practice data show a median of two reviewers in several organizations and a median of one at Google;
      observational links between review participation and post-release defects did not hold up robustly
      in an independent replication.
    - Re-review after changes is governed by documented policy (approval with comments for minor follow-ups;
      optional dismissal of stale approvals on any diff change), not by measured outcomes in the fetched
      sources.
  .research/analysis/campaigns/qvc-review-evidence/specialists/warning-noise.md:
    summary: 'Evidence from industrial static analysis (Google, Facebook, Coverity), developer interview
      and mining studies, operations paging guidance, security-operations alarm triage, and clinical decision-support
      alert overrides on how people respond to warnings with high false-positive rates, which numeric
      thresholds have been used and under what definitions, and which practices keep advisory signals
      acted on. The sources converge that noisy warnings delivered outside the work context are ignored,
      but they also show diff-time findings, given to developers as part of code review, acted on at high
      rates at Facebook (the source does not say whether those reports gate landing), and review-time
      findings drawing low not-useful click ratios (which undercount ignoring) at Google, where they are
      curated by an action-rate feedback loop and socially enforced before approval. As a composed reading,
      delivery point, curation, and volume/repetition are more associated with decay than advisory status
      as such, though one review found no volume-override relationship.

      '
    key_findings:
    - 'Same analysis, same estimated false-positive rate: Facebook reports a near-zero fix rate for a
      nightly batch bug list versus over 70% when reported at diff time (demonstrated, small uncontrolled
      batch sample).'
    - 'Google''s published thresholds are definition-specific: zero effective false positives for build-breaking
      checks, under 10% effective false positives for code-review checks, analyzer probation at a not-useful
      click rate of 10% or more and possible shut-off above 25% (designed).'
    - 'Coverity''s vendor experience: more than 30% false positives ''easily cause problems'', aim below
      20% for stable checkers; a not-understood true report is commonly labelled false (documented).'
    - Google found compiler warnings ignored and moved checks to errors or code review; yet non-blocking
      code-review findings run at about a 5% platform not-useful click ratio, which undercounts ignoring,
      with thousands of fix requests per day (documented and demonstrated).
    - Clinical alerts are overridden in 49% to 96% of cases across studies, but about half of outpatient
      overrides were judged appropriate (12%-92% by alert type), so override rate is not a direct measure
      of degradation (independently measured; demonstrated).
    - Severity tiering, with only higher-severity alerts interrupting and the lowest tier information-only,
      was associated with 29% vs 10% overall compliance and 29% vs 11% on the interruptive Level 2 tier;
      the most severe tier was 100% by hard-stop design vs 34%, and the information-only tier's response
      was not collected (demonstrated, observational).
    - Acceptance falls with alert volume and within-patient repeats (about 30% per extra reminder per
      encounter; 10% per 5-point rise in repeat share), but no desensitization over time was found for
      newly deployed alerts (independently measured).
    - 'Numeric thresholds are not commensurable across sources: ''effective false positive'' (no action
      taken), ''false positive'' (cannot happen), ''not-useful rate'' (click ratio), and ''override rate''
      measure different things.'
  .research/analysis/campaigns/solution-space-decomposition/clusters/completeness.md:
    summary: 'Cross-specialist synthesis over four facets (search completeness, coverage estimation, taxonomy
      construction, landscape mapping) on how a sample of approaches or kinds can be checked for completeness
      before depth work. Across the fields, completeness of the process, recall of items against a known
      set, and completeness of the set of kinds or families are distinct quantities. For families of methods
      or approaches, only the first two have measured practice in the attested corpus; richness estimators
      are evaluated in their own settings (ecology, fuzzing, inspections) and applied to vocabulary with
      model fit rather than a known total. Every estimate is relative to a frame (the generating process,
      the identity threshold for a kind, the chosen dimensions, the known set), and each estimator has
      its own inputs: two or more captures for capture–recapture, replicated units for incidence data,
      frequency counts for abundance data, or a random sample of the remainder for screening tests. "No
      new items in the last run" rules measurably fail or are unvalidated. Models detected planted omissions
      markedly less often than planted wrong inclusions (one abstract-level study reports the same direction
      for human testers), and disagreement between passes is partly classification rather than retrieval.'
    key_findings:
    - No attested source validates a completeness estimate for families of methods or approaches; measured
      practice there covers item recall against a known or pooled set, while richness estimators are evaluated
      in ecology, fuzzing and inspections and applied to vocabulary.
    - Chao-type estimators give lower bounds under heterogeneous detection; sample coverage (share of
      abundance or incidence probability already represented, not share of kinds) is more robustly estimable
      than the number of missing kinds.
    - Every completeness figure is conditional on the generating process, the identity threshold that
      merges near-duplicates, the rank counted and the frame of dimensions or known items.
    - Estimator inputs differ: capture–recapture needs two or more captures treated as independent, incidence
        estimators replicated units, abundance estimators frequency counts, screening tests a random sample
        of the remainder; few occasions widen intervals, and inspection studies advise against fewer than
        four inspectors unless shown to work in a particular environment.
    - In screening, the baseline-rate and 50-consecutive-misses heuristics each missed the 95% recall
      target in about 39% of runs, and at thematic-saturation stopping points median coverage of observed
      themes was 78–82%; reading these as evidence about any quiet last pass is a transfer.
    - Missing items can mean missing categories; independent maps of one topic overlap little, and part
      of their disagreement is classification, not retrieval.
    - Models detected planted omissions far less often than planted wrong inclusions, and one abstract-level
      study reports the same direction for human testers; marking where content is absent recovered much
      of the gap in one surface benchmark.
  .research/analysis/campaigns/solution-space-decomposition/clusters/generation.md:
    summary: Cross-specialist synthesis over four facets (design-space methods, decision-option generation,
      analogous-domain search, LLM ideation diversity) on how to generate a set of genuinely different
      approaches rather than variations of one. Unaided human generation recovers roughly a third to a
      half of later-recognised items; LLM generation, measured by similarity and category coverage, narrows
      mainly across independent draws and across models. In the conditions tested, upfront examples, similarity
      feedback and standard multi-agent debate narrowed sets, while voting over independent responses
      did not; exposure to AI ideas narrowed collective diversity in one study and widened it in a dynamic
      multi-generation pool in another (the widening study at search-summary depth); independent generation
      before discussion, then pooling, widened a set in one case. Measured gains come from a second pass
      that states the first is incomplete, conditioning on prior output with an instruction to differ,
      objectives or purpose as stimuli, and abstraction at a workable level for distant retrieval. Structured
      generators (morphological fields, QOC, set-based design, strategy tables) are advocated or demonstrated,
      not measured against unstructured generation, and the effect of domain distance is mixed.
    key_findings:
    - Unaided generation of objectives and alternatives recovers roughly 30–50% of later-recognised items,
      and omitted items are about as important as generated ones.
    - LLM idea pools are narrower mainly across independent draws and across models; a single session's
      list can look varied while repeated draws return the same modes.
    - In the conditions tested, upfront examples (more misses), similarity feedback and standard multi-agent
      debate narrowed sets; voting over independent responses did not; exposure to AI ideas narrowed collective
      diversity in one study and widened it in a dynamic multi-generation pool in another (the widening
      study at search-summary depth); independent lists pooled before discussion gave a more complete
      set in one case, against a reference built from those lists.
    - Measured gains come from a second pass with a warning and a numeric target, from generation that
      sees prior items and is told to differ, from distinct per-draw cues, and from objectives or purpose
      used as stimuli.
    - The fields test "different approach" by the abstraction level at which ideas diverge (principle
      versus embodiment), a different value on a declared dimension, or non-equivalence under a declared
      relation.
    - Structured generators lack controlled evidence of better coverage; the one reported matrix-size
      result was negative, TRIZ results are mixed, and the effect of domain distance on novelty and quality
      is contradictory.
  .research/analysis/campaigns/solution-space-decomposition/parent.md:
    summary: Campaign synthesis over eight facets (design-space methods, decision-option generation, analogous-domain
      search, LLM ideation diversity, search completeness, coverage estimation, taxonomy construction,
      landscape mapping). Unaided human generation recovers roughly a third to a half of later-recognised
      objectives or alternatives and narrows toward familiar examples and a person's dominant category;
      language-model generation, measured differently, converges on the same modes across independent
      draws and across models. Remedies with measured support in their tested settings are an objectives-
      or purpose-first generation key, a second pass that states the first is incomplete and sets a target,
      generation that sees prior items and is told to differ, and abstraction at a workable level for
      distant retrieval; independent generation before group discussion is a prescription, with pooling
      demonstrated in one case; upfront examples, similarity feedback and standard multi-agent debate
      narrowed sets in the studies that tested them. No attested source validates a completeness estimator
      for families of methods or approaches; completeness signals are relative to a declared frame, each
      estimator has its own input and independence assumptions, and a model-based lower bound applies
      only where those assumptions hold, while "nothing new in the last pass" measurably fails in screening.
      Models detected planted omissions far less often than planted wrong inclusions. No attested source
      gives a validated rule for when to stop challenging a sample and begin depth research; the synthesis
      offers an escalation trigger as an inference. Structured generators are advocated more than measured.
    key_findings:
    - Unaided human generation recovers roughly 30–50% of later-recognised objectives or alternatives,
      and omitted items are about as important as found ones; language-model narrowing is measured as
      similarity and category coverage, not as this recovery fraction.
    - Upfront examples, similarity feedback and standard multi-agent debate narrowed sets where tested;
      voting over independent responses did not; exposure to AI ideas narrowed collective diversity in
      one study and widened it in a dynamic multi-generation pool in another (the widening study at search-summary
      depth). Independent generation before discussion is a prescription, with pooling demonstrated in
      one case whose reference was the pooled union.
    - Measured second-pass gains come from stating the first pass is incomplete with a numeric target,
      or showing prior items with an instruction to differ; more time does not help.
    - No attested source validates a completeness estimator for families of methods or approaches; capture–recapture
      needs at least two passes, incidence estimators need replicated sampling units, abundance estimators
      need frequency counts from a sample, and screening tests need a random sample of the remainder;
      estimates are frame-relative and are not certification.
    - In screening, the baseline-rate and 50-consecutive-misses heuristics each missed the 95% recall
      target in about 39% of runs, and median thematic-saturation stopping points left part of the observed
      themes unseen; applying this to "the last challenge pass added nothing" is a transfer.
    - Models detected planted omissions far less often than planted wrong inclusions and judged presented
      candidates much more accurately than they authored full sets; one abstract-level study found human
      testers detecting more commission than omission faults.
    - Fields distinguish a different approach from a variation by the abstraction level of divergence,
      a different value on a declared dimension, or non-equivalence under a declared relation; every such
      test depends on the frame chosen.
  .research/analysis/campaigns/solution-space-decomposition/specialists/analogous-domain-search.md:
    summary: 'Within-specialist brief on finding different solution approaches by searching distant or
      analogous domains: broadcast search and solver distance, analogous-market search, design-by-analogy
      with near vs far sources, problem abstraction as a retrieval key (functional models, WordTrees,
      purpose-mechanism schemas, multi-analog schema induction, LLM-generated analogies), and design fixation
      as the cause of variations-of-one-idea. Measured effects of distance are mixed and partly contradictory:
      distant sources raise novelty and variance in some studies and lower novelty and quality in others;
      several report a too-near/too-far band, and one large field study finds an inverse distance–creativity
      relation. The more consistent measured findings concern the retrieval step: unaided retrieval is
      surface-bound, problem abstraction and comparison across multiple analogs improve far retrieval,
      and retrieval that is diverse in mechanism while staying close in purpose beats both keyword-similar
      and random stimuli in one controlled test.'
